name: Build JUDGETUNE

# Runs on every upload (push) and whenever you click "Run workflow" on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: JUDGETUNE-Windows
          - os: macos-latest
            name: JUDGETUNE-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (downloads JUCE the first time)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJT_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package VST3 and the standalone app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/JUDGETUNE_artefacts/Release/VST3
            build/JUDGETUNE_artefacts/Release/Standalone
          if-no-files-found: error
